name: Build Installers (APK & EXE)

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      - name: Build Windows NSIS & Portable EXE
        working-directory: desktop
        run: npm run dist

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-to-webpage-windows-exe
          path: desktop/dist/*.exe
          retention-days: 30

  build-android-apk:
    name: Android Package (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name:- name: Accept pre-installed Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Generate Android project & inject icons
        working-directory: mobile
        run: |
          npx cap add android
          npm run configure:android
          npx cap sync android

      - name: Compile Android APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-to-webpage-android-apk
          path: mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

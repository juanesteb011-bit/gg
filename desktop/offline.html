<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screenshot to Webpage</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0F172A;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        text-align: center;
      }
      main {
        max-width: 420px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 16px;
        padding: 32px 24px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0 0 24px;
        font-size: 14px;
        line-height: 1.55;
        color: #cbd5e1;
      }
      button {
        border: 0;
        border-radius: 10px;
        background: #2563EB;
        color: #ffffff;
        padding: 11px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión a internet</h1>
      <p>No se pudo cargar Screenshot to Webpage porque el dispositivo no tiene acceso a la red en este momento.</p>
      <button onclick="window.location.href='https://screenshot-to-webpage-34.lovable.app'">Reintentar conexión</button>
    </main>
  </body>
</html>
